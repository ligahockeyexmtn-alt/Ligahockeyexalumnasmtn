<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga de Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090F;
    --panel:#0F1730;
    --panel-alt:#161F42;
    --line:#FFFFFF;
    --line-soft:rgba(213,221,255,0.14);
    --text:#FFFFFF;
    --text-dim:#93A0D6;
    --accent:#0C45A5;
    --accent-dim:rgba(12,69,165,0.28);
    --verde:#007945;
    --verde-dim:rgba(0,121,69,0.20);
    --verde2:#076A49;
    --verde2-dim:rgba(7,106,73,0.22);
    --celeste:#D5DDFF;
    --celeste-dim:rgba(213,221,255,0.12);
    --gold:#CDA434;
    --gold-dim:rgba(205,164,52,0.16);
    --silver:#B9C0C6;
    --silver-dim:rgba(185,192,198,0.14);
    --danger:#D64545;
    --success:#009156;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(12,69,165,0.14), transparent 42%),
      radial-gradient(circle at 100% 15%, rgba(7,106,73,0.10), transparent 45%),
      radial-gradient(circle at 30% 100%, rgba(0,121,69,0.06), transparent 40%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; top:0; left:0; right:0; height:4px; z-index:50;
    background:linear-gradient(90deg, var(--accent) 0%, var(--accent) 35%, var(--verde2) 35%, var(--verde2) 68%, var(--celeste) 68%, var(--celeste) 100%);
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  #app{max-width:960px;margin:0 auto;padding:0 16px 80px;}

  /* HEADER */
  .header{
    padding:28px 16px 18px;
    max-width:960px;margin:0 auto;
    border-bottom:1px solid var(--line-soft);
    position:relative;
  }
  .header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .header h1{font-size:clamp(28px,6vw,42px); color:var(--line);}
  .header .desc{color:var(--text-dim); margin-top:6px; font-size:14.5px; max-width:640px; line-height:1.5; padding-right:100px;}
  .mode-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em;
    padding:5px 10px; border-radius:20px; margin-top:14px;
  }
  .mode-badge.editor{background:var(--accent-dim); color:var(--celeste); border:1px solid rgba(12,69,165,0.5);}
  .mode-badge.viewer{background:rgba(159,182,170,0.12); color:var(--text-dim); border:1px solid var(--line-soft);}

  /* NAV */
  .nav{
    display:flex; gap:4px; overflow-x:auto; padding:14px 0;
    max-width:960px; margin:0 auto; position:sticky; top:0; z-index:10;
    background:var(--bg); border-bottom:1px solid var(--line-soft);
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav button{
    flex-shrink:0;
    background:transparent; border:1px solid transparent; color:var(--text-dim);
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em;
    font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px;
    cursor:pointer; transition:all .15s;
  }
  .nav button:hover{color:var(--line);}
  .nav button.active{background:var(--panel-alt); color:var(--accent); border-color:var(--line-soft); box-shadow:inset 0 -2px 0 var(--verde2);}

  /* GENERIC */
  .section{padding:22px 0;}
  .card{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:18px; margin-bottom:14px;
  }
  .card h2{font-size:15px; color:var(--text-dim); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .card h2::before{content:''; width:16px; height:16px; border:2px solid var(--accent); border-radius:50%; display:inline-block; flex-shrink:0;}
  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; letter-spacing:0.02em;}
  input[type=text], input[type=number], textarea{
    width:100%; background:var(--panel-alt); border:1px solid var(--line-soft); color:var(--text);
    padding:9px 11px; border-radius:7px; font-family:'Inter',sans-serif; font-size:14px; outline:none;
  }
  input[type=number]{width:64px; text-align:center; font-family:'IBM Plex Mono',monospace;}
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  textarea{min-height:70px; resize:vertical;}
  select{
    width:100%; background:var(--panel-alt); border:1px solid var(--line-soft); color:var(--text);
    padding:8px 9px; border-radius:7px; font-size:13.5px; outline:none;
  }
  select:disabled, input:disabled{opacity:0.7;}
  button.btn{
    background:var(--accent); color:#FFFFFF; border:none; font-family:'Oswald',sans-serif;
    text-transform:uppercase; letter-spacing:0.03em; font-weight:600; font-size:13px;
    padding:10px 16px; border-radius:7px; cursor:pointer; transition:filter .15s;
  }
  button.btn:hover{filter:brightness(1.1);}
  button.btn.ghost{background:transparent; border:1px solid var(--line-soft); color:var(--text);}
  button.btn.small{padding:6px 10px; font-size:11.5px;}
  button.btn.danger{background:var(--danger); color:var(--line);}
  button.icon-btn{
    background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:16px;
    padding:2px 6px; line-height:1;
  }
  button.icon-btn:hover{color:var(--danger);}
  .empty{color:var(--text-dim); font-size:14px; padding:20px 0; text-align:center; line-height:1.6;}

  /* INICIO */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-top:4px;}
  .stat-box{
    border:1px solid var(--line-soft); border-top:2px solid var(--accent); border-radius:var(--radius); padding:14px 12px;
    background:var(--panel-alt); position:relative; overflow:hidden;
  }
  .stat-box:nth-of-type(2){border-top-color:var(--verde);}
  .stat-box:nth-of-type(3){border-top-color:var(--verde2);}
  .stat-box:nth-of-type(4){border-top-color:var(--celeste);}
  .stat-box .num{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; color:var(--accent);}
  .stat-box .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
  .circle-frame{
    border:2px solid var(--celeste); border-bottom:none; border-radius:50% 50% 0 0 / 60px 60px 0 0;
    width:100%; max-width:260px; height:80px; margin:16px auto 0; display:flex; align-items:flex-end;
    justify-content:center; padding-bottom:6px;
  }
  .link-row{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;}
  .link-box{
    flex:1; min-width:180px; background:var(--panel-alt); border:1px solid var(--line-soft);
    border-radius:7px; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    color:var(--text-dim); overflow-x:auto; white-space:nowrap;
  }

  /* EQUIPOS */
  .team-grid{display:grid; grid-template-columns:1fr; gap:12px;}
  .team-header-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .team-header-row input{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:16px; font-weight:600; flex:1;}
  .escudo-upload-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .file-label{cursor:pointer; display:inline-block;}
  .logo-liga-header{
    position:absolute; top:28px; right:16px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .logo-liga-img{
    width:96px; height:96px; border-radius:50%; object-fit:cover; border:1px solid var(--line-soft);
    background:var(--panel-alt);
  }
  .logo-liga-controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;}
  .roster-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap;}
  .player-list{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .player-chip{
    background:var(--panel-alt); border:1px solid var(--line-soft); border-radius:20px;
    padding:5px 6px 5px 12px; font-size:12.5px; display:flex; align-items:center; gap:4px;
  }
  .add-player-row{display:flex; gap:8px;}

  /* CALENDARIO */
  .jornada-title{
    font-size:13px; color:var(--accent); letter-spacing:0.08em; margin:22px 0 10px;
    display:flex; align-items:center; gap:10px;
  }
  .jornada-title::after{content:''; flex:1; height:1px; background:var(--line-soft);}
  .bloque-title{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--verde2); background:var(--verde2-dim); display:inline-block; padding:4px 10px;
    border-radius:20px; margin:10px 0 8px;
  }
  .match-card{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:14px; margin-bottom:10px;
  }
  .match-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .cancha-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim);
    border:1px solid var(--line-soft); padding:2px 8px; border-radius:20px;
  }
  .teams-row{display:flex; align-items:center; justify-content:center; gap:14px;}
  .team-name{font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:14.5px; flex:1; text-align:center;}
  .team-name.home{text-align:right;}
  .team-name.away{text-align:left;}
  .score-inputs{display:flex; align-items:center; gap:8px;}
  .vs{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .score-static{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--accent); min-width:24px; text-align:center;}
  .match-actions{display:flex; justify-content:center; margin-top:10px;}
  .goles-section{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line-soft);}
  .goles-side{margin-bottom:10px;}
  .goles-side-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .goles-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px;}
  .tie-row{display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-soft);}
  .pill-status{font-size:11px; padding:3px 9px; border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .pill-status.pendiente{background:rgba(159,182,170,0.12); color:var(--text-dim);}
  .pill-status.jugado{background:var(--verde-dim); color:var(--success);}

  /* TABLA */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-dim); text-align:center; padding:8px 6px; border-bottom:1px solid var(--line-soft);
  }
  th.left, td.left{text-align:left;}
  td{padding:9px 6px; text-align:center; font-family:'IBM Plex Mono',monospace; border-bottom:1px solid rgba(239,233,218,0.06);}
  td.left{font-family:'Inter',sans-serif; font-weight:600;}
  tr.zona-oro td.left{border-left:3px solid var(--gold);}
  tr.zona-plata td.left{border-left:3px solid var(--silver);}
  .table-wrap{overflow-x:auto;}
  .pos-badge{
    display:inline-block; width:20px; height:20px; line-height:20px; border-radius:4px;
    font-size:11px; font-weight:600;
  }
  .zona-leyenda{display:flex; gap:16px; margin-top:10px; font-size:11.5px; color:var(--text-dim); flex-wrap:wrap;}
  .zona-leyenda span{display:flex; align-items:center; gap:6px;}
  .zona-leyenda i{width:10px; height:10px; border-radius:2px; display:inline-block;}

  /* GOLEADORAS */
  .rank-row{display:flex; align-items:center; gap:14px; padding:11px 6px; border-bottom:1px solid rgba(239,233,218,0.06);}
  .rank-num{font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--text-dim); width:24px; text-align:center;}
  .rank-row:nth-child(1) .rank-num{color:var(--gold); font-size:18px;}
  .rank-info{flex:1;}
  .rank-name{font-weight:600; font-size:14px;}
  .rank-team{font-size:11.5px; color:var(--text-dim);}
  .rank-goals{font-family:'IBM Plex Mono',monospace; font-size:18px; color:var(--accent); font-weight:600;}

  /* PLAYOFFS */
  .copa-block{margin-bottom:30px;}
  .copa-title{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .copa-title .icon{width:22px;height:22px;border-radius:50%;flex-shrink:0;}
  .copa-title.oro .icon{background:var(--gold);}
  .copa-title.plata .icon{background:var(--silver);}
  .copa-title h2{font-size:18px; color:var(--line);}
  .bracket-row{display:flex; gap:10px; flex-wrap:wrap;}
  .bracket-col{flex:1; min-width:260px;}
  .final-wrap{margin-top:6px;}
  .champion-banner{
    text-align:center; padding:16px; border:1px solid; border-radius:var(--radius); margin-top:6px;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.05em; font-size:15px;
  }
  .champion-banner.oro{border-color:var(--gold); color:var(--gold); background:var(--gold-dim);}
  .champion-banner.plata{border-color:var(--silver); color:var(--silver); background:var(--silver-dim);}

  .warn-box{
    background:var(--accent-dim); border:1px solid rgba(12,69,165,0.4); border-radius:var(--radius);
    padding:12px 14px; font-size:13px; color:var(--text-dim); line-height:1.5; margin-bottom:14px;
  }
  .divider-circle{
    display:flex; align-items:center; justify-content:center; margin:26px 0;
  }
  .divider-circle::before, .divider-circle::after{content:''; flex:1; height:1px; background:var(--line-soft);}
  .divider-circle .c{width:10px;height:10px;border:1.5px solid var(--accent); border-radius:50%; margin:0 12px;}

  .overlay{
    position:fixed; inset:0; background:rgba(6,16,12,0.72); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay-box{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:20px; max-width:340px; width:100%;
  }
  .overlay-box p{font-size:14px; line-height:1.5; margin:0 0 16px;}
  .overlay-actions{display:flex; gap:8px; justify-content:flex-end;}
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); display:none;
    background:var(--panel-alt); border:1px solid var(--accent); color:var(--text);
    padding:10px 16px; border-radius:8px; font-size:13px; z-index:110; max-width:88vw; text-align:center;
  }
  .clave-inline{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; width:100%;
  }
  .clave-inline input{max-width:200px;}
  .clave-error{font-size:12px; color:var(--danger); margin-top:6px; width:100%;}

  @media(max-width:520px){
    .teams-row{flex-direction:column; gap:6px;}
    .team-name.home, .team-name.away{text-align:center;}
    .score-inputs{justify-content:center;}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<div class="nav" id="nav"></div>
<div id="app"><p class="empty">Cargando datos de la liga…</p></div>

  <div class="overlay-box">

    <div class="overlay-actions">
      <button class="btn ghost small" onclick="confirmNo()">Cancelar</button>
      <button class="btn small" onclick="confirmYes()">Confirmar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function crearPartidoVacio(homeId, awayId, id){
  return {id, homeId, awayId, homeScore:null, awayScore:null, goles:{home:[],away:[]}, jugado:false, desempateGanador:null};
}
function resolverGanador(match){
  if(!match || match.homeScore===null || match.awayScore===null) return null;
  if(match.homeScore>match.awayScore) return match.homeId;
  if(match.awayScore>match.homeScore) return match.awayId;
  return match.desempateGanador || null;
}

function computeStats(teamIds, matches){
  const stats={};
  teamIds.forEach(id=> stats[id]={pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0});
  (matches||[]).filter(m=>m.jugado && teamIds.includes(m.homeId) && teamIds.includes(m.awayId)).forEach(m=>{
    const h=stats[m.homeId], a=stats[m.awayId];
    h.pj++; a.pj++;
    h.gf+=m.homeScore; h.gc+=m.awayScore;
    a.gf+=m.awayScore; a.gc+=m.homeScore;
    if(m.homeScore>m.awayScore){ h.pg++; h.pts+=3; a.pp++; }
    else if(m.homeScore<m.awayScore){ a.pg++; a.pts+=3; h.pp++; }
    else { h.pe++; a.pe++; h.pts+=1; a.pts+=1; }
  });
  return stats;
}

function compararEquipos(a,b,statsMap,matches){
  const sa=statsMap[a.id], sb=statsMap[b.id];
  if(sb.pts!==sa.pts) return sb.pts-sa.pts;
  const dgA=sa.gf-sa.gc, dgB=sb.gf-sb.gc;
  if(dgB!==dgA) return dgB-dgA;
  const partido=(matches||[]).find(m=>m.jugado && ((m.homeId===a.id&&m.awayId===b.id)||(m.homeId===b.id&&m.awayId===a.id)));
  if(partido){
    const aHome = partido.homeId===a.id;
    const scoreA = aHome?partido.homeScore:partido.awayScore;
    const scoreB = aHome?partido.awayScore:partido.homeScore;
    if(scoreA!==scoreB) return scoreB-scoreA;
  }
  if(sb.gf!==sa.gf) return sb.gf-sa.gf;
  return a.nombre.localeCompare(b.nombre);
}

function tablaOrdenada(teamIds, matches){
  const stats = computeStats(teamIds, matches);
  const teams = teamIds.map(id=>getTeam(id)).filter(Boolean);
  teams.sort((a,b)=>compararEquipos(a,b,stats,matches));
  return teams.map(t=>({team:t, stats:stats[t.id]}));
}

/* ---------- FIXTURE GENERATION ---------- */
function barajar(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
const BLOQUE_HORARIO = {1:'20:00 – 20:45', 2:'20:45 – 21:30'};
// Slots fijos por jornada: cancha1 y cancha2 tienen 2 partidos (uno en cada bloque), cancha3 tiene 1 (solo bloque 1)
const SLOTS_JORNADA = [
  {cancha:1, bloque:1}, {cancha:1, bloque:2},
  {cancha:2, bloque:1}, {cancha:2, bloque:2},
  {cancha:3, bloque:1}
];

function _generarUnaTanda(rounds, ids){
  const teamStats = {};
  ids.forEach(id=> teamStats[id] = {cancha:{1:0,2:0,3:0}, bloque:{1:0,2:0}});
  const tanda = [];
  rounds.forEach((matches, ri)=>{
    const poolMatches = matches.map(m=>({...m}));
    const poolSlots = barajar(SLOTS_JORNADA).map(s=>({...s}));
    const asignaciones = [];
    while(poolMatches.length){
      let mejor = null;
      poolMatches.forEach((m, mi)=>{
        poolSlots.forEach((s, si)=>{
          const costo =
            teamStats[m.home].cancha[s.cancha] + teamStats[m.away].cancha[s.cancha] +
            teamStats[m.home].bloque[s.bloque] + teamStats[m.away].bloque[s.bloque];
          if(!mejor || costo < mejor.costo){ mejor = {mi, si, costo}; }
        });
      });
      const m = poolMatches[mejor.mi];
      const s = poolSlots[mejor.si];
      asignaciones.push({m, s, jornada:ri+1});
      teamStats[m.home].cancha[s.cancha]++; teamStats[m.away].cancha[s.cancha]++;
      teamStats[m.home].bloque[s.bloque]++; teamStats[m.away].bloque[s.bloque]++;
      poolMatches.splice(mejor.mi,1);
      poolSlots.splice(mejor.si,1);
    }
    tanda.push(...asignaciones);
  });
  // puntaje de qué tan pareja quedó la distribución (menor = mejor)
  let varianza = 0;
  ids.forEach(id=>{
    const c = teamStats[id].cancha, b = teamStats[id].bloque;
    const cVals = [c[1],c[2],c[3]], bVals=[b[1],b[2]];
    const cProm = cVals.reduce((a,v)=>a+v,0)/cVals.length;
    const bProm = bVals.reduce((a,v)=>a+v,0)/bVals.length;
    cVals.forEach(v=> varianza += Math.pow(v-cProm,2));
    bVals.forEach(v=> varianza += Math.pow(v-bProm,2));
  });
  return {tanda, varianza};
}

function generarFixtureData(){
  const ids = state.teams.map(t=>t.id);
  const n = ids.length;
  let arr = ids.slice();
  const rounds=[];
  for(let r=0;r<n-1;r++){
    const roundMatches=[];
    for(let i=0;i<n/2;i++){
      roundMatches.push({home:arr[i], away:arr[n-1-i]});
    }
    const fixed=arr[0];
    const rest=arr.slice(1);
    rest.unshift(rest.pop());
    arr=[fixed,...rest];
    rounds.push(roundMatches);
  }

  // Genera varios intentos con distinto orden aleatorio y se queda con el más parejo
  let mejorTanda = null, mejorVarianza = Infinity;
  for(let intento=0; intento<40; intento++){
    const {tanda, varianza} = _generarUnaTanda(rounds, ids);
    if(varianza < mejorVarianza){ mejorVarianza = varianza; mejorTanda = tanda; }
  }

  const fixture=[];
  let matchId=1;
  mejorTanda.forEach(({m,s,jornada})=>{
    const partido = crearPartidoVacio(m.home, m.away, 'm'+(matchId++));
    partido.jornada = jornada;
    partido.cancha = s.cancha;
    partido.bloque = s.bloque;
    fixture.push(partido);
  });
  return fixture;
}

/* ---------- PLAYOFFS GENERATION ---------- */
function generarPlayoffsData(){
  const allIds = state.teams.map(t=>t.id);
  const tabla = tablaOrdenada(allIds, state.fixture||[]);
  const ordered = tabla.map(r=>r.team.id);
  const goldIds = ordered.slice(0,4);
  const silverIds = ordered.slice(4,8);
  return {
    generado:true,
    gold:{
      semi1: crearPartidoVacio(goldIds[0], goldIds[3], 'gold-semi1'),
      semi2: crearPartidoVacio(goldIds[1], goldIds[2], 'gold-semi2'),
      final: crearPartidoVacio(null, null, 'gold-final')
    },
    silver:{
      semi1: crearPartidoVacio(silverIds[0], silverIds[3], 'silver-semi1'),
      semi2: crearPartidoVacio(silverIds[1], silverIds[2], 'silver-semi2'),
      final: crearPartidoVacio(null, null, 'silver-final')
    }
  };
}

function actualizarFinal(copa){
  const w1=resolverGanador(copa.semi1), w2=resolverGanador(copa.semi2);
  if(w1 && w2){
    if(copa.final.homeId!==w1 || copa.final.awayId!==w2){
      copa.final.homeId=w1; copa.final.awayId=w2;
      copa.final.homeScore=null; copa.final.awayScore=null;
      copa.final.goles={home:[],away:[]}; copa.final.jugado=false; copa.final.desempateGanador=null;
    }
    return true;
  }
  return false;
}

/* ---------- REGISTRY (para onclick handlers) ---------- */
function buildRegistry(){
  MATCH_REGISTRY = {};
  (state.fixture||[]).forEach(m=>{
    MATCH_REGISTRY[m.id] = { match:m, save:()=>saveKey('fixture', state.fixture) };
  });
  if(state.playoffs){
    ['gold','silver'].forEach(copaKey=>{
      const copa = state.playoffs[copaKey];
      actualizarFinal(copa);
      ['semi1','semi2','final'].forEach(k=>{
        const m = copa[k];
        MATCH_REGISTRY[m.id] = { match:m, save:()=>saveKey('playoffs', state.playoffs) };
      });
    });
  }
}

function subirEscudo(teamId, inputEl){
  if(!isEditor) return;
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Selecciona un archivo de imagen.'); inputEl.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 240;
      let w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/png');
      const t = getTeam(teamId);
      t.escudo = dataUrl;
      saveKey('teams', state.teams);
      render();
      showToast('Escudo actualizado.');
    };
    img.onerror = function(){ showToast('No se pudo leer la imagen, intenta con otro archivo.'); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ showToast('No se pudo leer el archivo.'); };
  reader.readAsDataURL(file);
  inputEl.value = '';
}

function renderNav(){
  const tabs = [
    ['inicio','Inicio'], ['equipos','Equipos'], ['calendario','Calendario'],
    ['tabla','Tabla'], ['goleadoras','Goleadoras'], ['playoffs','Playoffs']
  ];
  document.getElementById('nav').innerHTML = tabs.map(([id,label])=>
    `<button class="${currentTab===id?'active':''}" onclick="cambiarTab('${id}')">${label}</button>`
  ).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

/* ---------- RENDER: INICIO ---------- */
function renderInicio(){
  const total = state.fixture ? state.fixture.length : 0;
  const jugados = state.fixture ? state.fixture.filter(m=>m.jugado).length : 0;
  const jugadorasTotal = state.teams.reduce((acc,t)=>acc+t.jugadoras.length,0);
  const golesTotal = (state.fixture||[]).reduce((acc,m)=> acc + (m.jugado ? m.homeScore+m.awayScore : 0), 0);

  let html = '';

  if(isEditor){
    html += `
    <div class="card">
      <h2>Datos de la liga</h2>
      <label for="liga-nombre">Nombre de la liga</label>
      <input type="text" id="liga-nombre" value="${escapeHtml(state.meta.nombre)}" style="margin-bottom:10px;">
      <label for="liga-desc">Descripción</label>
      <textarea id="liga-desc">${escapeHtml(state.meta.descripcion||'')}</textarea>
      <div style="margin-top:10px;"><button class="btn" onclick="guardarMeta()">Guardar</button></div>
    </div>`;
  }

  html += `
    <div class="card">
      <h2>Resumen de temporada</h2>
      <div class="circle-frame"><span class="mono" style="font-size:22px;color:var(--accent);">${jugados}/${total || 45}</span></div>
      <p style="text-align:center; color:var(--text-dim); font-size:12px; margin-top:6px;">partidos jugados de la fase regular</p>
      <div class="stat-row" style="margin-top:16px;">
        <div class="stat-box"><div class="num">${state.teams.length}</div><div class="lbl">Equipos</div></div>
        <div class="stat-box"><div class="num">${jugadorasTotal}</div><div class="lbl">Jugadoras</div></div>
        <div class="stat-box"><div class="num">${golesTotal}</div><div class="lbl">Goles (fase regular)</div></div>
        <div class="stat-box"><div class="num">${state.playoffs?'Sí':'No'}</div><div class="lbl">Playoffs generados</div></div>
      </div>
    </div>`;

  if(!state.fixture){
    html += `<div class="warn-box">Todavía no se ha generado el calendario de la fase regular. ${isEditor?'Ve a la pestaña <b>Calendario</b> para generarlo.':'Un editor debe generar el calendario primero.'}</div>`;
  }

  if(isEditor){
    const baseUrl = location.origin + location.pathname;
    const editLink = baseUrl + '?clave=' + CLAVE_EDITOR;
    html += `
    <div class="card">
      <h2>Enlace para compartir</h2>
      <p style="font-size:13px; color:var(--text-dim); margin-bottom:10px;">Es un solo link para todas las personas. Las jugadoras lo abren y ven todo en modo lectura. Las editoras, además, tocan el botón <b>"🔒 Ingresar clave de edición"</b> arriba y escriben la clave para desbloquear la edición en su navegador.</p>
      <div class="link-row">
        <div class="link-box" id="link-view">${baseUrl}</div>
        <button class="btn small" id="btn-link-view" onclick="copiarLink('link-view')">Copiar</button>
      </div>
      <p style="font-size:11.5px; color:var(--text-dim); margin-top:10px;">La clave de edición es: <span class="mono" style="color:var(--accent);">${CLAVE_EDITOR}</span></p>
    </div>`;
  }

  document.getElementById('app').innerHTML = html;
}

/* ---------- RENDER: EQUIPOS ---------- */
function renderEquipos(){
  let html = `<div class="team-grid">`;
  state.teams.forEach(t=>{
    html += `
    <div class="card">
      <div class="team-header-row">
        ${escudoHtml(t.id, 44)}
        ${isEditor
          ? `<input type="text" value="${escapeHtml(t.nombre)}" onchange="actualizarNombreEquipo('${t.id}', this.value)">`
          : `<h2 style="border:none; padding:0; font-size:16px;">${escapeHtml(t.nombre)}</h2>`}
        <span class="roster-count">${t.jugadoras.length}/20</span>
      </div>
      ${isEditor ? `
      <div class="escudo-upload-row">
        <label class="btn ghost small file-label">
          ${t.escudo ? 'Cambiar escudo' : 'Subir escudo'}
          <input type="file" accept="image/*" style="display:none;" onchange="subirEscudo('${t.id}', this)">
        </label>
        ${t.escudo ? `<button class="btn ghost small" onclick="quitarEscudo('${t.id}')">Quitar escudo</button>` : ''}
      </div>` : ''}
      <div class="player-list">
        ${t.jugadoras.length===0 ? `<span class="empty" style="padding:6px 0;">Sin jugadoras inscritas</span>` :
          t.jugadoras.map(j=>`
            <span class="player-chip">${escapeHtml(j.nombre)}
              ${isEditor ? `<button class="icon-btn" onclick="eliminarJugadora('${t.id}','${j.id}')" title="Eliminar">✕</button>` : ''}
            </span>`).join('')}
      </div>
      ${isEditor ? `
      <div class="add-player-row">
        <input type="text" id="nueva-jugadora-${t.id}" placeholder="Nombre de la jugadora" onkeydown="if(event.key==='Enter')agregarJugadora('${t.id}')">
        <button class="btn small" onclick="agregarJugadora('${t.id}')">Añadir</button>
      </div>` : ''}
    </div>`;
  });
  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

/* ---------- MATCH CARD (reutilizable) ---------- */
function renderMatchCard(matchId, opts){
  opts = opts || {};
  const entry = MATCH_REGISTRY[matchId];
  if(!entry) return `<div class="match-card"><p class="empty">Pendiente de definir</p></div>`;
  const match = entry.match;
  if(!match.homeId || !match.awayId){
    return `<div class="match-card"><p class="empty">${opts.pendienteLabel || 'Pendiente de definir según resultados anteriores'}</p></div>`;
  }
  const homeTeam = getTeam(match.homeId), awayTeam = getTeam(match.awayId);
  const canEdit = isEditor;
  const empatado = match.jugado && match.homeScore===match.awayScore;
  const ganador = resolverGanador(match);

  let scoreBlock;
  if(canEdit){
    scoreBlock = `
      <div class="score-inputs">
        <input type="number" min="0" id="home-score-${match.id}" value="${match.homeScore??''}">
        <span class="vs">·</span>
        <input type="number" min="0" id="away-score-${match.id}" value="${match.awayScore??''}">
      </div>`;
  } else {
    scoreBlock = match.jugado
      ? `<div class="score-inputs"><span class="score-static">${match.homeScore}</span><span class="vs">–</span><span class="score-static">${match.awayScore}</span></div>`
      : `<span class="pill-status pendiente">Por jugar</span>`;
  }

  let html = `
  <div class="match-card">
    <div class="match-top">
      <span class="cancha-tag">${opts.cancha!==undefined ? 'Cancha '+opts.cancha : (opts.label||'')}</span>
      <span class="pill-status ${match.jugado?'jugado':'pendiente'}">${match.jugado?'Jugado':'Pendiente'}</span>
    </div>
    <div class="teams-row">
      <span class="team-name home">${escapeHtml(homeTeam.nombre)} ${escudoHtml(match.homeId, 26)}</span>
      ${scoreBlock}
      <span class="team-name away">${escudoHtml(match.awayId, 26)} ${escapeHtml(awayTeam.nombre)}</span>
    </div>
    ${canEdit ? `<div class="match-actions">
        <button class="btn small" onclick="guardarMarcador('${match.id}')">Guardar marcador</button>
        ${match.jugado ? `<button class="btn small ghost" style="margin-left:8px;" onclick="borrarMarcador('${match.id}')">Borrar</button>` : ''}
      </div>` : ''}
  `;

  if(match.jugado && empatado && !ganador && canEdit){
    html += `
    <div class="tie-row">
      <span style="font-size:12.5px; color:var(--text-dim);">Empate — definición:</span>
      <button class="btn small ghost" onclick="setDesempate('${match.id}','${match.homeId}')">${escapeHtml(homeTeam.nombre)}</button>
      <button class="btn small ghost" onclick="setDesempate('${match.id}','${match.awayId}')">${escapeHtml(awayTeam.nombre)}</button>
    </div>`;
  } else if(match.jugado && empatado && !ganador && !canEdit){
    html += `<div class="tie-row"><span style="font-size:12.5px; color:var(--text-dim);">Empate — pendiente de definición</span></div>`;
  }

  if(match.jugado){
    html += `<div class="goles-section">`;
    html += renderGolesLado(match, 'home', homeTeam, canEdit);
    html += renderGolesLado(match, 'away', awayTeam, canEdit);
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function renderGolesLado(match, side, team, canEdit){
  const arr = match.goles[side];
  if(arr.length===0) return '';
  let html = `<div class="goles-side"><div class="goles-side-label">Goles de ${escapeHtml(team.nombre)}</div><div class="goles-grid">`;
  arr.forEach((playerId, idx)=>{
    if(canEdit){
      const options = team.jugadoras.map(j=>`<option value="${j.id}" ${playerId===j.id?'selected':''}>${escapeHtml(j.nombre)}</option>`).join('');
      html += `<select onchange="setGoal('${match.id}','${side}',${idx},this.value)">
        <option value="">Gol ${idx+1} — Selecciona jugadora</option>
        ${options}
      </select>`;
    } else {
      const p = getPlayer(team.id, playerId);
      html += `<div style="font-size:13px; padding:7px 9px; background:var(--panel-alt); border-radius:7px; border:1px solid var(--line-soft);">Gol ${idx+1}: ${p ? escapeHtml(p.nombre) : '<span style="color:var(--text-dim);">sin registrar</span>'}</div>`;
    }
  });
  html += `</div></div>`;
  return html;
}

/* ---------- RENDER: CALENDARIO ---------- */
function renderCalendario(){
  let html = '';
  if(isEditor){
    html += `<div class="card">
      <h2>Calendario</h2>
      <p style="font-size:13px; color:var(--text-dim); margin-bottom:12px;">10 equipos, fase regular a una vuelta: 9 jornadas de 5 partidos. Cada jornada se divide en Bloque 1 (${BLOQUE_HORARIO[1]}, 3 partidos, uno por cancha) y Bloque 2 (${BLOQUE_HORARIO[2]}, 2 partidos, en canchas 1 y 2). La cancha y el bloque de cada equipo se reparten lo más parejo posible durante toda la temporada.</p>
      <button class="btn ${state.fixture?'ghost':''}" onclick="generarCalendario()">${state.fixture ? 'Generar de nuevo' : 'Generar calendario'}</button>
    </div>`;
  }
  if(!state.fixture){
    html += `<p class="empty">Aún no hay calendario generado.</p>`;
    document.getElementById('app').innerHTML = html;
    return;
  }
  const jornadas = {};
  state.fixture.forEach(m=>{ (jornadas[m.jornada] = jornadas[m.jornada]||[]).push(m); });
  Object.keys(jornadas).sort((a,b)=>a-b).forEach(j=>{
    html += `<div class="jornada-title">Jornada ${j}</div>`;
    [1,2].forEach(bloque=>{
      const partidos = jornadas[j].filter(m=>m.bloque===bloque).sort((a,b)=>a.cancha-b.cancha);
      if(partidos.length===0) return;
      html += `<div class="bloque-title">Bloque ${bloque} · ${BLOQUE_HORARIO[bloque]}</div>`;
      partidos.forEach(m=>{
        html += renderMatchCard(m.id, {cancha:m.cancha});
      });
    });
  });
  document.getElementById('app').innerHTML = html;
}

/* ---------- RENDER: TABLA ---------- */
function renderTabla(){
  if(!state.fixture){
    document.getElementById('app').innerHTML = `<p class="empty">Genera primero el calendario en la pestaña Calendario.</p>`;
    return;
  }
  const allIds = state.teams.map(t=>t.id);
  const filas = tablaOrdenada(allIds, state.fixture);
  let html = `<div class="card"><h2>Tabla de posiciones — Fase regular</h2>
  <div class="table-wrap"><table>
    <thead><tr>
      <th>#</th><th class="left">Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th>
    </tr></thead><tbody>`;
  filas.forEach((f,i)=>{
    const pos=i+1;
    const zonaClass = pos<=4 ? 'zona-oro' : (pos<=8 ? 'zona-plata' : '');
    const dg = f.stats.gf - f.stats.gc;
    html += `<tr class="${zonaClass}">
      <td>${pos}</td>
      <td class="left"><span style="display:inline-flex;align-items:center;gap:8px;">${escudoHtml(f.team.id, 22)}${escapeHtml(f.team.nombre)}</span></td>
      <td>${f.stats.pj}</td><td>${f.stats.pg}</td><td>${f.stats.pe}</td><td>${f.stats.pp}</td>
      <td>${f.stats.gf}</td><td>${f.stats.gc}</td><td>${dg>0?'+':''}${dg}</td>
      <td style="color:var(--accent); font-weight:600;">${f.stats.pts}</td>
    </tr>`;
  });
  html += `</tbody></table></div>
  <div class="zona-leyenda">
    <span><i style="background:var(--gold);"></i> 1° al 4° — Copa de Oro</span>
    <span><i style="background:var(--silver);"></i> 5° al 8° — Copa de Plata</span>
  </div>
  <p style="font-size:11.5px; color:var(--text-dim); margin-top:10px;">Criterios de desempate: 1) diferencia de gol, 2) resultado entre los equipos empatados.</p>
  </div>`;
  document.getElementById('app').innerHTML = html;
}

/* ---------- RENDER: GOLEADORAS ---------- */
function renderGoleadoras(){
  const conteo = {}; // playerId -> {nombre, teamName, goles}
  function contarEnMatches(matches){
    (matches||[]).forEach(m=>{
      if(!m.jugado) return;
      ['home','away'].forEach(side=>{
        const teamId = side==='home'?m.homeId:m.awayId;
        const team = getTeam(teamId);
        (m.goles[side]||[]).forEach(playerId=>{
          if(!playerId) return;
          const p = getPlayer(teamId, playerId);
          if(!p) return;
          if(!conteo[playerId]) conteo[playerId] = {nombre:p.nombre, equipo:team?team.nombre:'', equipoId:teamId, goles:0};
          conteo[playerId].goles++;
        });
      });
    });
  }
  contarEnMatches(state.fixture);
  if(state.playoffs){
    ['gold','silver'].forEach(k=>{
      const copa = state.playoffs[k];
      contarEnMatches([copa.semi1, copa.semi2, copa.final]);
    });
  }
  const ranking = Object.values(conteo).sort((a,b)=>b.goles-a.goles);
  let html = `<div class="card"><h2>Tabla de goleadoras</h2>`;
  if(ranking.length===0){
    html += `<p class="empty">Todavía no hay goles registrados.</p>`;
  } else {
    ranking.forEach((r,i)=>{
      html += `<div class="rank-row">
        <div class="rank-num">${i+1}</div>
        ${escudoHtml(r.equipoId, 30)}
        <div class="rank-info"><div class="rank-name">${escapeHtml(r.nombre)}</div><div class="rank-team">${escapeHtml(r.equipo)}</div></div>
        <div class="rank-goals">${r.goles}</div>
      </div>`;
    });
  }
  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

/* ---------- RENDER: PLAYOFFS ---------- */
function renderPlayoffs(){
  let html = '';
  if(isEditor){
    html += `<div class="card">
      <h2>Playoffs</h2>
      <p style="font-size:13px; color:var(--text-dim); margin-bottom:12px;">Se generan a partir de la tabla de posiciones: 1°–4° a Copa de Oro, 5°–8° a Copa de Plata. Cruces: 1°v4°, 2°v3° (y 5°v8°, 6°v7°).</p>
      <button class="btn ${state.playoffs?'ghost':''}" onclick="generarPlayoffsClick()">${state.playoffs?'Generar de nuevo':'Generar playoffs'}</button>
    </div>`;
  }
  if(!state.playoffs){
    html += `<p class="empty">Aún no se han generado los playoffs.</p>`;
    document.getElementById('app').innerHTML = html;
    return;
  }

  ['gold','silver'].forEach(copaKey=>{
    const copa = state.playoffs[copaKey];
    const esOro = copaKey==='gold';
    html += `<div class="copa-block">
      <div class="copa-title ${esOro?'oro':'plata'}"><span class="icon"></span><h2>Copa de ${esOro?'Oro':'Plata'}</h2></div>
      <div class="bracket-row">
        <div class="bracket-col">
          <div class="jornada-title" style="margin-top:0;">Semifinal 1</div>
          ${renderMatchCard(copa.semi1.id, {label:'Semifinal'})}
        </div>
        <div class="bracket-col">
          <div class="jornada-title" style="margin-top:0;">Semifinal 2</div>
          ${renderMatchCard(copa.semi2.id, {label:'Semifinal'})}
        </div>
      </div>
      <div class="jornada-title">Final</div>
      <div class="final-wrap">${renderMatchCard(copa.final.id, {label:'Final', pendienteLabel:'La final se habilita cuando ambas semifinales tengan resultado.'})}</div>
      ${copa.final.jugado ? (()=>{
        const w = resolverGanador(copa.final);
        return w ? `<div class="champion-banner ${esOro?'oro':'plata'}">🏆 Campeón: ${escapeHtml(teamName(w))}</div>` : '';
      })() : ''}
    </div>`;
  });

  document.getElementById('app').innerHTML = html;
}

/* ---------- MAIN RENDER ---------- */
function render(){
  try{
    buildRegistry();
    renderHeader();
    renderNav();
    if(currentTab==='inicio') renderInicio();
    else if(currentTab==='equipos') renderEquipos();
    else if(currentTab==='calendario') renderCalendario();
    else if(currentTab==='tabla') renderTabla();
    else if(currentTab==='goleadoras') renderGoleadoras();
    else if(currentTab==='playoffs') renderPlayoffs();
  }catch(e){
    console.error('Error en render():', e);
    document.getElementById('app').innerHTML =
      '<div class="warn-box">Ocurrió un error mostrando esta sección.<br><br>'
      + '<b>Detalle técnico (mándale esto a Facundo/soporte):</b><br>'
      + '<span class="mono" style="font-size:12px;">' + escapeHtml(e.message) + '</span><br><br>'
      + '<span class="mono" style="font-size:11px; color:var(--text-dim);">' + escapeHtml(e.stack||'') + '</span>'
      + '</div>';
  }
}

/* ---------- INIT ---------- */
async function init(){
  isEditor = new URLSearchParams(location.search).get('clave') === CLAVE_EDITOR;
  await loadState();
  render();
}
init();
</script>
